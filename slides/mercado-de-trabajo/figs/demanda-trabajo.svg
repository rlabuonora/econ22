<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Curva de demanda de trabajo</title>
  <desc id="desc">Si sube el salario de W1 a W2, la cantidad demandada de trabajadores disminuye de L1 a L2.</desc>
  <rect width="1400" height="700" fill="white"/>
  <g fill="none" stroke="#23313d" stroke-width="4">
    <path d="M145 25 V620 H1360"/>
  </g>
  <g fill="none" stroke="#8b969f" stroke-width="3" stroke-dasharray="12 9">
    <path d="M145 251.5 H680 V620"/>
    <path d="M145 325.2 H850 V620"/>
  </g>
  <path d="M250 65 L1230 490" fill="none" stroke="#5e82ae" stroke-width="8"/>
  <g fill="#5e82ae">
    <circle cx="680" cy="251.5" r="11"/>
    <circle cx="850" cy="325.2" r="11"/>
  </g>
  <g font-family="sans-serif" font-size="36" fill="#23313d">
    <text x="40" y="340" transform="rotate(-90 40 340)" text-anchor="middle">Salario (W)</text>
    <text x="750" y="693" text-anchor="middle">Cantidad de trabajadores (L)</text>
    <text x="125" y="262" text-anchor="end">W₂</text>
    <text x="125" y="336" text-anchor="end">W₁</text>
    <text x="680" y="658" text-anchor="middle">L₂</text>
    <text x="850" y="658" text-anchor="middle">L₁</text>
    <text x="985" y="356" fill="#5e82ae">Demanda de trabajo</text>
  </g>
</svg>
